            schema: { $ref: "#/components/schemas/WorkspaceCommand" }
      responses:
        "200":
          description: Selected capsule and selection reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapsuleSelection" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/recovery-capsules/{capsule_id}:
    parameters: [{ $ref: "#/components/parameters/CapsuleId" }]
    get:
      operationId: getRecoveryCapsule
      tags: [recovery]
      responses:
        "200":
          description: Canonical Recovery Capsule
          content:
            application/json:
              schema: { $ref: "../schemas/recovery-capsule-v1.json" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/recovery-capsules/{capsule_id}/verify:
    parameters: [{ $ref: "#/components/parameters/CapsuleId" }]
    post:
      operationId: verifyRecoveryCapsule
      tags: [recovery]
