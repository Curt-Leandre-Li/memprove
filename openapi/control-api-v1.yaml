  /v1/tasks/{task_id}/transition:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    post:
      operationId: transitionTask
      tags: [tasks]
      description: >-
        Moves a Task along proposed -> ready -> in_progress -> completed,
        in_progress <-> blocked, proposed|ready|blocked -> cancelled, and
        appends one task.transitioned Event without a Session (payload
        task_id, from, to, revision, completion_evidence_ids) in the same
        transaction (P2-C). completed (Owner decision, P2-C) requires a
        non-empty completion_evidence_ids: each Evidence must belong to the
        Task, have status PASS, and be verified at the time of the
        transition by the Recovery Preview's evidence judgement, against a
        read-only probe of workspace_id when given (else the Workspace of the
        Task's latest Checkpoint Snapshot, else its scoped Workspace);
        otherwise 409 evidence_stale. An unknown workspace_id is 404
        workspace_not_resolved and one of another Project 409
        project_workspace_mismatch. Other targets take neither field (400
        invalid_request). force_reason is still 400 invalid_request in Phase
        2. A replay of a recorded transition is not judged again. The Task's
        completion_evidence_ids are read back from its task.transitioned
        Event. P3-D3: a passed run is not verified when the latest run of the
        same argv in the same Task, Workspace, and repository state
        (capture_manifest_digest) did not pass, nor (P3-L L2) a passed test
        run when the latest test run of that argv there did not pass, so it
        completes nothing (409 evidence_stale). P3-L L3 (T15 N3): before any
        cited Evidence is judged, the Task Capsule's integrity check runs; a
        tampered Task (a record of the Task missing, not recomputing, or
        disagreeing with the ledger, or a broken Event chain) is 409
        evidence_stale whatever it cites, and the Task and the ledger do not
        change. P3-L3 (T16 S-2): that refusal, and only that one, carries a
        detail of fixed text: "the integrity check of the Task failed: a
        record of the Task is missing, does not recompute, or disagrees with
        the ledger, so no Evidence can complete it; a rerun does not help;
        run `memprove ledger verify` to see which record". The Problem's
        structure and code are unchanged. P4-H1 (Owner, T20 SF-1): the
        probed Workspace is read as the Recovery Preview reads it: a
        workspace_id that this Project's Event chain names is the caller's
        even when its row is missing, and a Workspace row that is missing or
        does not decode leaves the probe unavailable, so no cited Evidence
        is verified and the transition is 409 evidence_stale (not 503). U9 R1 (Owner O4, ADR 0020; the Owner's O8
        exception): a completion is judged by the Session the request names
        in its optional session_id, which the CLI's task complete and the
        MCP complete fill with the context's Session. When that Session
        declared the role sub_agent, the transition is 403 role_forbidden
        with the fixed detail "a Session declared as sub_agent cannot move the Task to
        completed; the orchestrating session or a person does it, and they can cite any
        Session's runs", whatever runs
        it cites, before the revision and every check of the cited Evidence,
        and the Task and the ledger do not change. An orchestrator, a human,
        or a Session that declared no agent completes on any Session's runs.
        A session_id that is no Session of the Task (as its Task Capsule's
        sessions lists them) is 400 invalid_request "$.session_id must name a
        Session of the Task", and with another target 400 invalid_request
        "$.session_id applies only to target_state completed". A request
        without session_id is not judged by role (older clients, direct
        calls): R1 guards against a mistake, not a pretence. A replay of a
        recorded transition is not judged again.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-write] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied, role_forbidden]
        "404": [resource_not_found, workspace_not_resolved]
        "409": [evidence_stale, idempotency_conflict, invalid_transition, revision_conflict, project_workspace_mismatch]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskTransitionRequest" }
      responses:
        "200": { $ref: "#/components/responses/Task" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tasks/{task_id}/recovery-preview:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    get:
      operationId: getRecoveryPreview
      tags: [recovery]
      description: >-
        ADR 0012 D6 (P2-B, FR-208). Read-only Recovery Preview of the Task's
        latest Checkpoint. Freezes the Project Event sequence N, then probes
        one Workspace with fixed-argv, read-only Git commands
        (--no-optional-locks): workspace_id when given (it must be a
        Workspace of the Task's Project), else the Workspace of the
        Checkpoint's Snapshot, else the Task's scoped Workspace. Verdicts
        propagate probe -> Snapshot -> Evidence -> statement -> Checkpoint ->
        Task (ADR 0012 P1-P6) with precedence tampered > partial > stale >
        verified; only verified_fact statements propagate to the Checkpoint.
        A probe that cannot run (for example a deleted worktree) yields
        partial, not an error. The body is RFC 8785 (JCS) bytes with no
        generation time; preview_digest is the SHA-256 of the JCS bytes of
        the document without preview_digest, so one (N, probe) yields
        identical bytes. Nothing is written and no Event is appended; the
        Task's status is never changed. P4-H1 (Owner, T20 SF-1): a Workspace
        row that is missing is read as one that does not decode: the probe is
        unavailable (200, never verified) and the row is not a damaged record;
        a workspace_id that this Project's Event chain names is the asker's
        even when its row is missing. A record of the Task that is missing or
        does not decode is a damaged record and the document is tampered,
        never 503; so is one whose text is not UTF-8, a zero revision, or an
        empty identity (named "" in damaged_records). 409 capsule_tampered
        remains for a state database that is not bound to the Project
        (x-memprove-unbound-state) and for a stored value the view cannot
        name as a damaged record, of which none is known.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-read] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [resource_not_found, workspace_not_resolved]
        "409": [project_workspace_mismatch, capsule_tampered]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/OptionalWorkspaceIdQuery" }]
      responses:
        "200":
          description: Recovery Preview (JCS bytes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryPreview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tasks/{task_id}/recovery-capsule:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    get:
      operationId: getTaskCapsule
      tags: [recovery]
      description: >-
        ADR 0013 D4 (P3-B, FR-405/FR-406). Read-only Task Capsule: every
        claim of the Task (every statement of every Checkpoint the ledger
        records for it, and every Decision), accumulated in ledger order
        with a Task-local number, kind, standing (active, superseded,
        withdrawn), and the verdict the Recovery Preview's functions give
        it. Freezes the Project Event sequence N, then probes one Workspace
        with fixed-argv, read-only Git commands (--no-optional-locks):
        workspace_id when given (it must be a Workspace of the Task's
        Project), else the Workspace of the latest Checkpoint's Snapshot,
        else the Task's scoped Workspace; the probe compares at most 16
        base commits with HEAD and lists the rest unprobed. The Task
        verdict is the worst verdict of its active facts; a broken Event
        chain or any record that is missing, does not recompute, or
        disagrees with the ledger makes every claim tampered. Only
        claim.superseded, decision.recorded, and session.crashed Events
        written by memproved on a Session of the Task are read. The body
        is RFC 8785 (JCS) bytes with no generation time; capsule_digest is
        the SHA-256 of the JCS bytes of the document without
        capsule_digest, so one (N, probe) yields identical bytes. Nothing is
        written and no Event is appended. The frozen recovery-capsule
        operations and schemas/recovery-capsule-v1.json are not implemented.
        P4-H1 (Owner, T20 SF-1): a Workspace row that is missing is read as
        one that does not decode: the probe is unavailable (200, never
        verified) and the row is not a damaged record; a workspace_id that
        this Project's Event chain names is the asker's even when its row is
        missing. A record of the Task that is missing or does not decode is a
        damaged record and the document is tampered, never 503; so is one
        whose text is not UTF-8, a zero revision, or an empty identity (named
        "" in damaged_records). 409 capsule_tampered remains for a state
        database that is not bound to the Project
        (x-memprove-unbound-state) and for a stored value the view cannot
        name as a damaged record, of which none is known.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-read] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [resource_not_found, workspace_not_resolved]
        "409": [project_workspace_mismatch, capsule_tampered]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/OptionalWorkspaceIdQuery" }]
      responses:
        "200":
          description: Task Capsule (JCS bytes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskCapsule" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
