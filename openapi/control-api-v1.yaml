        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/evidence/capture:
    post:
      operationId: captureEvidence
      tags: [evidence]
      description: >-
        ADR 0012 (P2-A). Records one command or test the caller ran in its own
        environment; memproved never runs the command. snapshot_id names the
        new RepositorySnapshot: memproved captures the Workspace with its
        fixed-argv, read-only Git probes (git_head and git_worktree Evidence)
        and seals the submitted command_run or test_run Evidence into that
        Snapshot, then appends one command.completed Event to the Session, all
        in one transaction. Only command_run and test_run are accepted (other
        artifact types and a non-null object_id are 400 invalid_request), and
        test_name, test_case_count, and test_format (U9 K2) apply to test_run only. A test_run
        passes only when exit_code is 0 and test_case_count is above 0. The
        Session must be active (else 409 invalid_transition), belong to the
        Workspace and continue task_id (else 409 project_workspace_mismatch
        or 400 invalid_request); an unknown Workspace is 404
        workspace_not_resolved, an unknown Task or Session 404
        resource_not_found, and a snapshot_id already recorded under another
        key 409 idempotency_conflict. The response is the command Evidence;
        its status is the PRD FR-203 outcome PASS, FAIL, NOT_RUN, or (P2-C,
        metadata.launch_error) UNAVAILABLE. A collector name starting with
        memproved, in any ASCII case (P2-E, P2-K), is 400 invalid_request;
        collector.name is a ClientName. Same-state carry-over (ADR 0013 D3,
        P3-D): the new Snapshot also seals the command_run and test_run
        Evidence of every earlier Snapshot of the same Task and Workspace
        with an equal capture_manifest_digest (the same repository, HEAD,
        branch, porcelain status, index, tracked content, and selected
        files), unless either status lists an untracked file; an object is
        carried only from the first Snapshot that seals it (P4-B: the one
        the ledger records first, never by captured_at), and only when
        that Snapshot and its Evidence recompute and agree with the ledger.
        The response's snapshot lists them in command_evidence_ids and
        test_evidence_ids, and command.completed records them like any
        Evidence of the Snapshot, so one Checkpoint over the new Snapshot
        can cite several runs of one state. A replay returns the recorded
        result and carries nothing again.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-write] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [workspace_not_resolved, resource_not_found]
        "409": [idempotency_conflict, project_workspace_mismatch, invalid_transition]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureEvidenceRequest" }
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/evidence/{evidence_id}:
    parameters: [{ $ref: "#/components/parameters/EvidenceId" }]
    get:
      operationId: getEvidence
      tags: [evidence]
      description: >-
        ADR 0012 (P2-A). One Evidence object, its digests recomputed, with the
        RepositorySnapshots that contain it. Raw Evidence stays control-only
        until redaction rules exist. P4-B (ADR 0014, item D): snapshot_ids
        lists them in ledger order, by the Project sequence of the first
        memproved Event that records each (then snapshot_id; one no Event
        records comes last), and snapshot is the first of them, the
        Snapshot through which Task completion and a Decision judge the
        object; captured_at plays no part. P4-H1 (Owner, T20 SF-1/SF-2): an
        Evidence row, or a Snapshot that contains it, that does not decode or
        recompute is 409 capsule_tampered, which no retry cures; an Evidence
        object no row holds is 404 resource_not_found.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [resource_not_found]
        "409": [capsule_tampered]
        "503": [service_not_ready]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/verification/runs:
    post:
      operationId: createVerificationRun
      tags: [verification]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVerificationRunRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/verification/runs/{run_id}:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      operationId: getVerificationRun
      tags: [verification]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/verification/ledger:
    post:
      operationId: verifyLedger
      tags: [verification]
      description: >-
        P2-C (Owner decision 2026-10-02: the frozen 202 Accepted cannot carry
        the result, so it is replaced by 200 LedgerVerification). Recomputes
        the Project's ledger in one read transaction: the Event chain in
        project_sequence order (digest v2, contiguous Project and Session
        sequences, previous-digest links), then every Evidence object,
        RepositorySnapshot, and Checkpoint with its digests recomputed. The
        result counts the records checked, gives the stored digest of the
        chain head, and names the first record that does not hold (Events
        first, then Evidence, Snapshots, Checkpoints, each in identity
        order); a ledger that does not verify is a 200 result with valid
        false, not an error. The frozen Idempotency-Key is required and
        checked but not recorded: the operation writes nothing and appends
        no Event, so a repeat verifies again. An unknown Project is 404
        project_not_found. P4-H1 (Owner, T20 SF-2): a row that is missing or
        does not decode anywhere the check reads, a Checkpoint statement's
        evidence_id included, is reported as first_failure (valid false),
        never as an error; 503 service_not_ready is only for a database that
        cannot be read. A value that decodes as its SQL type but not as what
        its column holds is such a row too: a Project sequence below 1 (the
        failure then has project_sequence null), text that is not UTF-8, a
        Task row whose task_id is not a UUIDv7. T21 (V1-S-2): so is a Task
        row any other column of which (project_id, title, created_at,
        updated_at, workspace_id, description) does not decode as listTasks
        and getTaskCapsule decode it; and a Task that a task.created or
        task.transitioned Event of memproved names and no row holds is
        reported missing (record_type task) with the Project sequence of its
        first Task Event. A state database that is not bound to the Project
        (x-memprove-unbound-state) is 409 capsule_tampered, which no retry
        cures.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-read] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [project_not_found]
        "409": [capsule_tampered]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCommand" }
      responses:
        "200":
          description: Ledger verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerVerification" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/conflicts:
    get:
      operationId: listConflicts
      tags: [conflicts]
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQuery" }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/ConflictState" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /v1/conflicts/{conflict_id}/acknowledge:
    parameters: [{ $ref: "#/components/parameters/ConflictId" }]
