      operationId: acknowledgeConflict
      tags: [conflicts]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/ExpectedRevisionCommand" }
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/conflicts/{conflict_id}/resolve:
    parameters: [{ $ref: "#/components/parameters/ConflictId" }]
    post:
      operationId: resolveConflict
      tags: [conflicts]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveConflictRequest" }
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/conflicts/{conflict_id}/dismiss:
    parameters: [{ $ref: "#/components/parameters/ConflictId" }]
    post:
      operationId: dismissConflict
      tags: [conflicts]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DismissConflictRequest" }
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/checkpoints:
    post:
      operationId: createCheckpoint
      tags: [checkpoints]
      description: >-
        ADR 0012 (P2-A). Records a Checkpoint over an already recorded
        RepositorySnapshot (from captureEvidence) without probing the
        repository again: the Snapshot is the anchor, and freshness is judged
        when read. Statements cite Evidence of that Snapshot; every
        verified_completed_work statement is a verified_fact; every
        verified_fact, in any section (P2-E), must cite a passed test_run
        (exit_code 0 and test_case_count above 0), and every test_run it
        cites must have passed; next_action is a recommendation or unknown;
        otherwise 400 invalid_request. A failed or unconfirmed result is
        recorded as user_supplied_context, recommendation, or unknown. project_event_sequence is the Project's latest Event
        sequence; a checkpoint.created Event is appended to the Session in
        the same transaction. Unknown Snapshot, Task, or Session is 404
        resource_not_found; a Workspace, Session, and Snapshot that disagree
        are 409 project_workspace_mismatch; a Session that does not continue
        task_id is 400 invalid_request; an ended Session is 409
        invalid_transition. ADR 0013 (P3-C): each statement's supersedes item
        and each withdrawals item is recorded as one claim.superseded Event
        of memproved (payload claim.superseded@1: task_id, relation
        supersedes or withdraws, target, and by, the new statement's claim ID
        or null) after checkpoint.created, in the same transaction, in
        request order; every target must be a readable claim of the same
        Task earlier in the ledger, not a statement of this Checkpoint, and
        named once per request, and a supersedes target that is a fact needs
        a verified_fact statement (P3-C2: a fact is superseded only by a
        fact; withdrawals take any claim), otherwise 400 invalid_request
        with a detail naming the item and the rule. A replay appends
        nothing. P3-D2: withdrawing a fact needs withdrawal_reason (else 400
        invalid_request, detail "$.withdrawals[i] names a fact; withdrawing a
        fact needs $.withdrawal_reason ..."); a withdrawal_reason without
        withdrawals is 400 invalid_request; when given, it is recorded as the
        optional reason member of every withdraws edge's claim.superseded@1
        payload (absent otherwise, so earlier payloads keep their shape).
        Every statement text and withdrawal_reason holds at most 4096
        characters (else 400 invalid_request). U1 C4: a statement text or
        withdrawal_reason that holds a string in the format of a memprove
        token (a run of exactly 43 characters of A-Z, a-z, 0-9, hyphen, and
        underscore, with none of those next to it) is 400 invalid_request
        with a fixed detail that names the member and does not repeat the
        text, before anything is written. P3-D3: a verified_fact, in any
        section, may not cite a passed run that the latest run of the same
        argv (element by element) in the same Task, Workspace, and repository
        state (capture_manifest_digest) overrules by not passing, whether or
        not that run was carried over; otherwise 400 invalid_request. Its
        detail (P3-L L1, P3-L3) first names, in one sentence and in request
        order, the position of every such citation, numbered: "<n>
        verified_fact citations name overruled passed runs: (1)
        $.<section>[i].evidence_ids[j], (2) ...", where j is the position in
        the request's evidence_ids; then it describes the citations one by
        one, "(k) Evidence <cited run> passed; the later run <later run> of
        its argv in this state did not pass: rerun until it passes.", or,
        for a test run the latest test run of its argv overrules (P3-L L2),
        "(k) test run Evidence <cited run> passed; the latest test run
        <that test run> did not pass: it needs a later passed test run."; a
        description that does not fit within the 512 characters is left out
        whole, and the detail then ends "<m> more not described.". A single
        citation reads "1 verified_fact citation names an overruled passed
        run: (1) ...". Up to eight positions all fit while every statement
        index i and Evidence index j in them is below 1000 (P4-A); with
        larger indices fewer may fit. When the positions themselves do not
        all fit, the first sentence ends ", and <m> more." and nothing
        follows it. U9 R1 (Owner O4, ADR 0020): when the Session's agent declared the
        role sub_agent, every withdrawals target must be a claim written by
        a Session whose agent declared the same agent name, and every
        supersedes target such a claim or an open item; any other target
        (written by a Session of another agent name, or by one that declared
        no agent; for withdrawals an open item too) is 403
        role_forbidden with the fixed detail "a Session declared as sub_agent can supersede
        open items and the statements written by Sessions of the same agent name, and can
        withdraw only statements written by Sessions of the same agent name; superseding
        another agent's facts, next actions, and Decisions, and withdrawing any statement
        another agent wrote, is for the orchestrating session or a person", and
        nothing of the Checkpoint is written. The
        implicit chain of next actions is no edge and is not limited. The
        roles and authors are read from the Task Capsule's ledger view; the
        check comes after every 400 and 409 check of the request.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-write] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied, role_forbidden]
        "404": [workspace_not_resolved, resource_not_found]
        "409": [idempotency_conflict, project_workspace_mismatch, invalid_transition]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCheckpointRequest" }
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/checkpoints/{checkpoint_id}:
    parameters: [{ $ref: "#/components/parameters/CheckpointId" }]
    get:
      operationId: getCheckpoint
      tags: [checkpoints]
      description: >-
        ADR 0012 (P2-A). One Checkpoint, its digest and those of its Snapshot
        and Evidence recomputed, with its statements and Snapshot summary.
        P4-H1 (Owner, T20 SF-1/SF-2): a Checkpoint row, or a record it is read
        with, that is missing or does not decode or recompute is 409
        capsule_tampered, which no retry cures; a Checkpoint no row holds is
        404 resource_not_found.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-read] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [resource_not_found]
        "409": [capsule_tampered]
        "503": [service_not_ready]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/recovery-capsules:
    post:
      operationId: createRecoveryCapsule
      tags: [recovery]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
