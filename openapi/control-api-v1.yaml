  /v1/decisions:
    post:
      operationId: proposeDecision
      tags: [decisions]
      description: >-
        ADR 0013 D2 (P3-C). Records one Decision of a Task: memproved
        appends one decision.recorded Event (payload decision.recorded@1:
        task_id, text, rationale, evidence_ids) to the Session, and then one
        claim.superseded Event (payload claim.superseded@1, relation
        supersedes, by decision/<event_id>) per supersedes item, all in one
        transaction; the Decision's identity is the decision.recorded Event's
        event_id and its claim ID is decision/<event_id>. There is no accept
        step; acceptDecision and supersedeDecision are not implemented. The
        Session must continue task_id (else 400 invalid_request) and be
        active (else 409 invalid_transition); an unknown Task or Session is
        404 resource_not_found. Each evidence_ids item must be recorded
        Evidence of the same Task, and each supersedes item a readable claim
        of the same Task earlier in the ledger, named once, and not a fact (a
        fact is superseded only by a fact, P3-C2); otherwise 400
        invalid_request with a detail naming the item and the rule. A replay
        returns the recorded Decision and appends nothing. P3-D2: content and
        rationale hold at most 4096 characters each (else 400
        invalid_request). U1 C4: a content or rationale that holds a string in
        the format of a memprove token (as createCheckpoint describes) is 400
        invalid_request with a fixed detail naming the member, before anything
        is written. A Decision is judged by the Evidence rule of a
        verified_fact, so it reads verified only on fresh, passed tests. U9 R1 (Owner O4, ADR 0020): a Session whose agent declared the role
        sub_agent records no Decision: 403 role_forbidden with the fixed
        detail "a Session declared as sub_agent cannot record a Decision; the orchestrating
        session or a person does it",
        and nothing is written. The role is the one the Session declared at
        createSession (agent.role), read from the Task Capsule's ledger view;
        a Session that declared none, an orchestrator, and a human are not
        limited. The check comes after every 400 and 409 check of the
        request.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-write] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied, role_forbidden]
        "404": [resource_not_found]
        "409": [idempotency_conflict, invalid_transition]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionProposal" }
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
