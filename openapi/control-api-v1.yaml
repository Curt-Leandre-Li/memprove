      responses:
        "200":
          description: Read-only verification and drift report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapsuleValidation" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/context-packs:
    post:
      operationId: createContextPack
      tags: [contexts]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
