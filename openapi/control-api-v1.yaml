openapi: 3.1.0
info:
  title: memprove Local Control API
  version: 1.0.0
  description: >-
    Local, authenticated control-plane contract. Unix sockets are the default
    transport. TCP deployments MUST bind to 127.0.0.1 and require a scoped
    bearer token.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://continuity.local
    description: Logical base URL used over a local Unix socket
security:
  - bearerAuth: []
x-memprove-json-decoding:
  duplicate_member_policy: reject_before_typed_dto
  failure: { status: 400, problem_code: invalid_request }
x-memprove-request-body-limit:
  description: >-
    ADR 0012. A request body larger than max_bytes is not read and fails
    like any unreadable body. Authentication and authorization are checked
    first, so an unauthenticated oversized request still gets 401.
  max_bytes: 2097152
  failure: { status: 400, problem_code: invalid_request }
x-memprove-problem-detail:
  description: >-
    P3-A. Every 400 Problem (invalid_request, unsupported_scope) carries a
    detail of 1 to 512 characters that names the field or parameter and the
    rule it violates, for example "$.root must be an absolute path without
    NUL" or "query parameter limit must be an integer from 1 through 500". A
    detail is built from fixed rule text and schema field names. It never
    repeats a token, an Idempotency-Key value, or text from the request
    body; a member or parameter name the schema does not define is repeated
    only when it is at most 32 characters of a-z, 0-9, and _. A 401 or 403
    Problem carries no detail. The Rust response validator keeps accepting a
    400 without a detail, because the frozen Phase 0 fixtures hold some;
    memproved emits only the strict form and checks every Problem it sends.
  status: 400
  required_member: detail
  max_chars: 512
x-memprove-unbound-state:
  description: >-
    P4-H1 (review of the first P4-H1 commit). A Project's state database
    whose binding (the state_metadata row naming the Project and its
    repository) or migration record (schema_migrations) is missing, does not
    decode, or differs from what this memproved expects is not read as the
    Project's ledger. Every operation listed here (the reads, and
    createTask and resolveWorkspace, which read the root Workspace first)
    answers 409 capsule_tampered, retryable false, with a fixed detail that
    says so; no retry cures it, so it is not 503 service_not_ready. A
    lookup by identity across Projects (getEvent, getEvidence,
    getCheckpoint, the Task of getTaskCapsule and getRecoveryPreview, the
    Workspace of listSessions) passes over such a Project and answers 409
    only when no other Project holds the record. The other write operations
    keep 503 service_not_ready. T21 (V1-S-1): a migration record behind its
    schema is such a record: when rows at its end, or the whole table, are
    missing while the schema already shows those migrations applied, no
    migration is applied again and nothing is written. T21 (V1-R-2): so is
    the state database of an ACTIVE Project that is missing (its file or
    its Project directory), of 0 bytes, or without any object. Only the
    provisioning of a Project (registerProject while the Project is not yet
    ACTIVE) creates a state database; no other operation creates or writes
    one, so such a database is not replaced by a new, empty ledger, and
    registerProject repeated for that Project answers 503
    service_not_ready. A lookup by identity for a write (the Session of
    endSession, the Workspace of createSession, captureEvidence, and
    createCheckpoint, the Task of transitionTask and proposeDecision)
    passes over such a Project too and answers 503 only when no other
    Project holds the record. U1 B5 (T21 V1-N-3): so is a Project whose
    registry record (the projects row) does not decode, such as a revision
    below 1 or text that is not UTF-8: the operations listed here answer
    409 capsule_tampered with the same fixed detail, which names that
    case, a lookup across Projects passes over it, and the other write
    operations keep 503 service_not_ready. Before, getProject of a record
    with revision 0 answered 500 without a body and the other reads of the
    Project 200; a created_at that is not UTF-8 gave 503 on every read.
  problem: { status: 409, problem_code: capsule_tampered }
  operations:
    - getProject
    - resolveWorkspace
    - listSessions
    - listTasks
    - createTask
    - listEvents
    - getEvent
    - getEvidence
    - getCheckpoint
    - getRecoveryPreview
    - getTaskCapsule
    - verifyLedger
x-memprove-auth-maintenance:
  bootstrap: offline_only
  recover_revoke_all: offline_only
  online_routes: []
  protected_v1_nonterminal_result:
    status: 503
    problem_code: service_not_ready
    check_order: before_authentication_and_authorization
tags:
  - name: health
  - name: auth
  - name: projects
  - name: workspaces
  - name: sessions
  - name: events
  - name: memory
  - name: decisions
  - name: tasks
  - name: evidence
  - name: verification
  - name: conflicts
  - name: checkpoints
  - name: recovery
  - name: contexts
paths:
  /health/live:
    get:
      operationId: healthLive
      tags: [health]
      security: []
      x-memprove-access: { kind: Anonymous, scopes: [] }
      x-memprove-problem-codes: {}
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /health/ready:
    get:
      operationId: healthReady
      tags: [health]
      security: []
      x-memprove-access: { kind: Anonymous, scopes: [] }
      x-memprove-problem-codes:
        "503": [service_not_ready]
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/status:
    get:
      operationId: getStatus
      tags: [health]
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control] }
      x-memprove-problem-codes:
        "401": [authentication_required]
        "403": [policy_denied]
        "503": [service_not_ready]
      responses:
        "200":
          description: Runtime status without secrets or absolute paths
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/version:
    get:
      operationId: getVersion
      tags: [health]
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: Authenticated, scopes: [] }
      x-memprove-problem-codes:
        "401": [authentication_required]
        "503": [service_not_ready]
      responses:
        "200":
          description: Version and supported contract capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/tokens:
    post:
      operationId: createClientToken
      tags: [auth]
      description: >-
        Creates one independently scoped client token. Duplicate JSON members
        are rejected before typed DTO decoding. A first successful request
        returns the secret exactly once. A same-key/same-digest replay returns
        200 with the original non-sensitive token business result and the same
        token_id, but never discloses the secret again. Token, idempotency
        record, and audit commit in one BEGIN IMMEDIATE transaction.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control] }
      x-memprove-problem-codes:
        "400": [invalid_request, unsupported_scope]
        "401": [authentication_required]
        "403": [policy_denied]
        "409": [idempotency_conflict]
        "503": [service_not_ready]
      x-memprove-idempotency:
        key: required
        same_key_same_digest: return_same_token_summary_without_secret
        same_key_different_digest: idempotency_conflict
        transaction_mode: BEGIN_IMMEDIATE
        atomic_records: [token, idempotency_record, audit]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientTokenRequest" }
      responses:
        "200": { $ref: "#/components/responses/TokenSummary" }
        "201": { $ref: "#/components/responses/TokenCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listClientTokens
      tags: [auth]
      description: >-
        Lists only active and revoked public token metadata. Secret material,
        verifier hashes, pending tokens, and discarded tokens are never returned.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "503": [service_not_ready]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/TokenSummaryPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/tokens/{token_id}/revoke:
    parameters: [{ $ref: "#/components/parameters/TokenId" }]
    post:
      operationId: revokeClientToken
      tags: [auth]
      description: >-
        Revokes an active token or returns the non-sensitive revoked summary for
        an already revoked target. Unknown, pending, and discarded targets share
        one indistinguishable resource_not_found result. The last effective
        control token cannot be revoked online. Self-revocation succeeds only if
        another control token remains; the old caller then receives 401 before
        any idempotency replay on every later request.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [resource_not_found]
        "409": [idempotency_conflict, last_control_token]
        "503": [service_not_ready]
      x-memprove-idempotency:
        key: required
        authentication_precedes_replay: true
        same_key_different_digest: idempotency_conflict
        transaction_mode: BEGIN_IMMEDIATE
        atomic_records: [token, idempotency_record, audit]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { $ref: "#/components/responses/TokenSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/projects/register:
    post:
      operationId: registerProject
      tags: [projects]
      description: >-
        Registers an explicit Project identity and its root Workspace identity;
        the returned root_workspace_id is the public Phase 1 bootstrap for
        Session and Event workspace references. No implicit default Project is
        created.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "409": [idempotency_conflict]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/RegisterProject" }
      responses:
        "201": { $ref: "#/components/responses/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_id}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getProject
      tags: [projects]
      description: >-
        P4-H1 (Owner, T20 SF-1/SF-2): a root Workspace row that is missing or
        does not decode is 409 capsule_tampered, which no retry cures; 503
        service_not_ready is only for a failure a retry can cure.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-read] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [project_not_found]
        "409": [capsule_tampered]
        "503": [service_not_ready]
      responses:
        "200": { $ref: "#/components/responses/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/workspaces/resolve:
    post:
      operationId: resolveWorkspace
      tags: [workspaces]
      description: >-
        Resolves the Workspace identity of the Git worktree containing path,
        for an explicit project_id. A linked worktree of the Project's own
        repository (same Git common directory) that is not yet registered is
        registered as a new Workspace exactly once; repeated calls return the
        same Workspace (ADR 0011). It creates or mutates no Project, Git,
        file-hash, Evidence, or Snapshot state, never registers a worktree of
        another repository, and has no Idempotency-Key. P2-C: a registration
        appends one workspace.registered Event without a Session in the same
        transaction; resolving a registered Workspace appends nothing. P4-H1
        (Owner, T20 SF-1/SF-2): a root Workspace row that is missing or does
        not decode, or a Workspace row at the resolved worktree that does not
        decode, is 409 capsule_tampered, which no retry cures; 503
        service_not_ready is only for a failure a retry can cure.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-write] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [project_not_found, workspace_not_resolved]
        "409": [project_workspace_mismatch, capsule_tampered]
        "503": [service_not_ready]
      requestBody: { $ref: "#/components/requestBodies/ResolveWorkspace" }
      responses:
        "200": { $ref: "#/components/responses/Workspace" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/workspaces/{workspace_id}/state:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      operationId: getWorkspaceState
      tags: [workspaces]
      responses:
        "200":
          description: Snapshot-bound current workspace state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceState" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/sessions:
    post:
      operationId: createSession
      tags: [sessions]
      description: >-
        Creates an active Session in the Workspace. The optional task_id links
        the Session to a Task of the same Project (ADR 0012): an unknown Task
        is 404 resource_not_found and a Task scoped to another Workspace is 409
        project_workspace_mismatch. The daemon appends a session.started Event
        (payload agent_id and task_id) in the same transaction, and with a
        task_id also a task.session_linked Event on the Session (P2-C,
        payload task_id and session_id); a replay appends nothing. P4-D
        (Owner A1): a task_id naming a completed or cancelled Task is 409
        invalid_transition, and nothing is written. ADR 0014 E6 (P4-F): the
        optional resumed_from declares the Context Pack the Session continues
        from; it is accepted only with a task_id, its project_sequence must
        not be above the Project's latest ledger sequence, and its digests
        and budget must have the ResumedFrom format, otherwise 400
        invalid_request and neither the Session nor any Event is written.
        With it, memproved appends capsule.recovered (payload
        capsule.recovered@1 {task_id, capsule_digest, project_sequence,
        pack_digest, budget, declared: true}) on the Session after
        session.started and task.session_linked, in the same transaction.
        The digests are the Session's own declaration; memproved cannot
        recompute them. resumed_from enters the request digest only when
        present.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-write] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [workspace_not_resolved, resource_not_found]
        "409": [idempotency_conflict, project_workspace_mismatch, invalid_transition]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listSessions
      tags: [sessions]
      description: >-
        P4-H1 (Owner, T20 SF-1/SF-2): a Session row of the page that does not
        decode (a zero revision included) is 409 capsule_tampered, which no
        retry cures. A Workspace whose row is missing is read as one whose
        row does not decode: when this Project's Event chain names it, its
        Sessions are listed; a Workspace neither a row nor an Event names is
        404 workspace_not_resolved.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-read] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [workspace_not_resolved]
        "409": [capsule_tampered]
        "503": [service_not_ready]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceIdQuery" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/SessionPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/sessions/{session_id}/end:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: endSession
      tags: [sessions]
      description: >-
        Ends an active Session. The daemon appends a session.ended Event whose
        payload carries reason (null when absent) in the same transaction,
        before ended_at is written (ADR 0012); reason is also part of the
        idempotency digest. The Session record has no reason. A replay
        appends nothing. ADR 0013 D6 (P3-D): the optional outcome is
        completed (the default) or abandoned; with abandoned, for a Session
        another agent left unfinished, the daemon appends session.crashed
        (payload session.crashed@1, {reason, outcome: abandoned}) in place of
        session.ended, so exactly one Event records the end either way, and
        the Session ends as with completed. outcome enters the idempotency
        digest only when it is abandoned, so an explicit completed equals an
        absent one. U9 A7 (Owner O3): the optional ended_by names who ends
        the Session as abandoned, as the ender reports itself; it is
        accepted only with outcome abandoned. Its session_id must name a
        Session of the same Project other than the one ended, and its agent
        follows createSession's agent rules (U8 O4); one of the two at
        least. Otherwise 400 invalid_request, and nothing is written. With
        it the Event is session.crashed@2, {reason, outcome: abandoned,
        ended_by}, and the Session row keeps the ender's Session, agent
        name, and role; without it the Event is session.crashed@1 as
        before. ended_by enters the idempotency digest only when present.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-write] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [resource_not_found]
        "409": [idempotency_conflict, invalid_transition, revision_conflict]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndSessionRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/events:
    post:
      operationId: ingestEvent
      tags: [events]
      description: >-
        Appends one Event to its Project's hash chain (ADR 0010). session_id is
        required for new Events; an unknown Session is 404 resource_not_found,
        and a Session that is not active is 409 invalid_transition. The
        event types memproved writes itself (P2-E: session.started,
        session.ended, command.completed, checkpoint.created, task.created,
        task.transitioned, task.session_linked, and workspace.registered;
        P3-C: claim.superseded and decision.recorded; P3-D: session.crashed;
        P4-F: capsule.recovered), the types ADR 0013 D8
        reserves to memproved (claim.superseded, decision.recorded, and
        session.crashed; P3-C2: capsule.recovered too, which memproved
        writes since P4-F with createSession's resumed_from), and a producer.name starting with memproved, in any ASCII case
        (P2-K), are 400 invalid_request here; producer.name is a ClientName.
        Only memproved's own Events may
        omit session_id (ADR 0012 D7); listEvents and getEvent return them
        with session_id null.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control, mcp-write] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [project_not_found, workspace_not_resolved, resource_not_found]
        "409": [idempotency_conflict, project_workspace_mismatch, invalid_transition]
        "503": [service_not_ready]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientEventEnvelope" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listEvents
      tags: [events]
      description: >-
        P4-H1 (Owner, T20 SF-1/SF-2): an Event row of the page that does not
        decode or recompute (its digests are recomputed on read) is 409
        capsule_tampered, which no retry cures.
      security: [{ bearerAuth: [] }]
      x-memprove-access: { kind: AnyOf, scopes: [control] }
      x-memprove-problem-codes:
        "400": [invalid_request]
        "401": [authentication_required]
        "403": [policy_denied]
        "404": [project_not_found]
        "409": [capsule_tampered]
        "503": [service_not_ready]
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQuery" }
